<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<!-- viewport fixed, zoomed & scrolling handle kora hoyeche -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Free Fire Token Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden; /* স্ক্রিন ডানে-বায়ে নড়বে না */
    touch-action: manipulation; /* জুমিং বা অপ্রয়োজনীয় জেসচার রোদ করবে */
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: #030712;
    color: #e2e8f0;
    min-height: 100vh;
    min-height: -webkit-fill-available; /* মোবাইল ব্রাউজার অ্যাড্রেসবারের জন্য */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    padding: 24px;
    border-radius: 20px;
    background: rgba(10, 16, 31, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 217, 255, 0.3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(0, 217, 255, 0.15);
    text-align: center;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 5vw, 22px); /* টেক্সট স্ক্রিন অনুযায়ী রেসপন্সিভ হবে */
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #00d9ff, #0055ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
    text-transform: uppercase;
  }

  .form-group {
    text-align: left;
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-field {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(0, 217, 255, 0.25);
    background: rgba(5, 9, 20, 0.7);
    color: #fff;
    font-size: 16px; /* ১৬ পিক্সেল দিলে আইফোনে ইনপুট দেওয়ার সময় স্ক্রিন জুম হবে না */
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .input-field:focus {
    border-color: #00d9ff;
    background: rgba(5, 9, 20, 0.9);
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00d9ff, #0055ff);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.8px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 12px rgba(0, 85, 255, 0.3);
    transition: transform 0.15s ease;
  }

  .btn-submit:active {
    transform: scale(0.98);
  }

  .response-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(5, 9, 20, 0.9);
    border: 1px solid rgba(0, 217, 255, 0.3);
    text-align: left;
  }

  .response-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #00d9ff;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  pre {
    background: rgba(0, 0, 0, 0.5);
    padding: 10px;
    border-radius: 8px;
    color: #00ffaa;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
</style>
</head>
<body>

<main class="card">
  <h1 class="title">Token Generator</h1>

  <div class="form-group">
    <label for="uid">Account UID</label>
    <input type="text" id="uid" class="input-field" placeholder="Ex: 18097039025" autocomplete="off">
  </div>

  <div class="form-group">
    <label for="password">Account Password</label>
    <input type="password" id="password" class="input-field" placeholder="Enter Password">
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="generateToken()">🔑 GENERATE TOKEN</button>

  <div class="response-box">
    <div class="response-header">API Response:</div>
    <pre id="responseJson">Waiting for input...</pre>
  </div>
</main>

<script>
async function generateToken() {
  const uid = document.getElementById('uid').value.trim();
  const password = document.getElementById('password').value.trim();
  const responseJson = document.getElementById('responseJson');
  const btnSubmit = document.getElementById('btnSubmit');

  if (!uid || !password) {
    alert("অনুগ্রহ করে UID এবং Password উভয়ই প্রদান করুন!");
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.style.opacity = "0.7";
  btnSubmit.textContent = "GENERATING...";
  responseJson.textContent = "⏳ Processing Request...";

  const url = `/token?uid=${encodeURIComponent(uid)}&password=${encodeURIComponent(password)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    responseJson.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    responseJson.textContent = JSON.stringify({
      status: "error",
      message: "API-এর সাথে সংযোগ করতে ব্যর্থ হয়েছে!",
      details: error.message
    }, null, 2);
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.style.opacity = "1";
    btnSubmit.textContent = "🔑 GENERATE TOKEN";
  }
}
</script>

</body>
</html>
